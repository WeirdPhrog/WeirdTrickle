  /api/v1/auth:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.StatusResponse'
      summary: Проверить, включена ли авторизация
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: 'Возвращает токен для заголовка Authorization: Bearer <token>.'
      parameters:
      - description: Логин и пароль
        in: body
        name: json
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Некорректные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Неверные учётные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Авторизация отключена
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить токен авторизации
      tags:
      - auth
  /api/v1/groups:
