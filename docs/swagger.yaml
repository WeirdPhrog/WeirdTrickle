info:
  contact: {}
  description: |-
    HTTP API v1. This API version is separate from the application release and configVersion.
    When authentication is enabled, send Authorization: Bearer <token>; obtain a token through POST /api/v1/auth.
  title: WeirdTrickle API
  version: "1.0"
